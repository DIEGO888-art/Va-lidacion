<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ======================================================================== -->
  <!-- CONFIGURACIÓN DE METADATOS Y ESTILOS VISUALES - REGISTRO DE USUARIOS     -->
  <!-- ======================================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Cuenta - Plataforma Segura</title>
  
  <!-- Importación de Tailwind CSS para diseño responsivo -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Importación de FontAwesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Estilos visuales modernos para tarjetas con efecto cristal */
    body {
      background: radial-gradient(circle at top left, #111827, #030712);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="min-h-screen text-slate-200 flex items-center justify-center p-4">

  <!-- Contenedor Principal del Formulario de Registro -->
  <div class="glass-card w-full max-w-md rounded-2xl p-6 sm:p-10">
    
    <!-- Encabezado Principal -->
    <div class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-2">Crear Cuenta</h1>
      <p class="text-slate-400 text-sm">Completa los campos para registrarte en el sistema</p>
    </div>

    <!-- Contenedor dinámico de alertas y mensajes informativos -->
    <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium transition-all duration-300"></div>

    <!-- Formulario de Registro con validaciones de entrada en tiempo real -->
    <form onsubmit="registrarUsuario(event)" class="space-y-4">
      
      <!-- Campo: Nombre Completo (permite espacios permitidos entre nombres) -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nombre Completo</label>
        <input type="text" id="regNombre" oninput="validarNombre()" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="Ej. Juan Pérez" required>
        <p id="err-nombre" class="text-rose-400 text-xs mt-1 hidden"></p>
      </div>

      <!-- Campo: Correo Electrónico (restringe espacios en blanco) -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Correo Electrónico</label>
        <input type="email" id="regCorreo" onkeydown="prevenirEspacios(event)" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="nombre@dominio.com" required>
      </div>

      <!-- Campo: Contraseña con requisitos de seguridad inspirados en normativas NIST -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Contraseña (8-12 car.)</label>
        <div class="relative">
          <input type="password" id="regPassword" onkeydown="prevenirEspacios(event)" oninput="evaluarPassword()" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 pr-10 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="••••••••" required>
          <button type="button" onclick="togglePass('regPassword', 'iconRegPass')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
            <i id="iconRegPass" class="fa-regular fa-eye"></i>
          </button>
        </div>
        <p id="err-password" class="text-rose-400 text-xs mt-1 hidden"></p>
      </div>

      <!-- Botón de envío para completar el registro -->
      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all duration-200 mt-2">
        Registrarse
      </button>
    </form>

    <!-- Enlace de retorno hacia el inicio de sesión -->
    <p class="text-center text-xs text-slate-400 mt-6">
      ¿Ya tienes una cuenta? <a href="login.html" class="text-indigo-400 hover:underline font-medium">Inicia sesión</a>
    </p>
  </div>

  <!-- =================================================================       -->
  <!-- LÓGICA DE VALIDACIÓN Y CONTROL EN JAVASCRIPT                            -->
  <!-- =================================================================       -->
  <script>
    /**
     * Función para prevenir la introducción de caracteres de espacio en campos protegidos.
     */
    function prevenirEspacios(e) {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
      }
    }

    /**
     * Función para alternar la visibilidad de los caracteres de contraseña.
     */
    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    /**
     * Despliegue dinámico de alertas para notificar estados de éxito o error.
     */
    function mostrarAlerta(mensaje, tipo = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerText = mensaje;
      if (tipo === 'error') {
        alertBox.className = 'mb-6 p-4 rounded-xl text-sm font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30';
      } else {
        alertBox.className = 'mb-6 p-4 rounded-xl text-sm font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
      }
      alertBox.classList.remove('hidden');
    }

    /**
     * Validación en tiempo real del campo nombre para prevenir caracteres no deseados.
     */
    function validarNombre() {
      const nombreInput = document.getElementById('regNombre').value;
      const errEl = document.getElementById('err-nombre');
      const regexPermitida = /^[a-zA-ZÁÉÍÓÚáéíóúÑñ\s]+$/;

      if (nombreInput.length > 0 && !regexPermitida.test(nombreInput)) {
        errEl.innerText = 'Solo se permiten letras y espacios válidos';
        errEl.classList.remove('hidden');
        return false;
      }
      errEl.classList.add('hidden');
      return true;
    }

    /**
     * Validación estricta de políticas de contraseñas seguras inspiradas en NIST.
     */
    function evaluarPassword() {
      const pwd = document.getElementById('regPassword').value;
      const contieneProhibidos = /[<>'\\&]/.test(pwd);
      const tieneEspecialValido = /[!@#$%^&*()_+\-=\[\]{};:,./?]/.test(pwd);
      const errEl = document.getElementById('err-password');

      if (contieneProhibidos) {
        errEl.innerText = 'Caracteres prohibidos (<> \' \\ &)';
        errEl.classList.remove('hidden');
        return false;
      }
      if (pwd.length < 8 || pwd.length > 12) {
        errEl.innerText = 'La longitud debe ser de 8 a 12 caracteres';
        errEl.classList.remove('hidden');
        return false;
      }
      if (!tieneEspecialValido) {
        errEl.innerText = 'Debe incluir al menos un carácter especial válido';
        errEl.classList.remove('hidden');
        return false;
      }
      errEl.classList.add('hidden');
      return true;
    }

    /**
     * Función que procesa el registro y almacena de forma segura los datos en localStorage.
     */
    function registrarUsuario(e) {
      e.preventDefault();

      if (!validarNombre() || !evaluarPassword()) {
        mostrarAlerta('Por favor, corrige los errores en el formulario.');
        return;
      }

      const nombre = document.getElementById('regNombre').value.trim();
      const correo = document.getElementById('regCorreo').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;

      // Creación del objeto de usuario
      const nuevoUsuario = { nombre, correo, password };

      // Almacenamiento persistente simulado en el navegador
      localStorage.setItem('registered_user', JSON.stringify(nuevoUsuario));

      mostrarAlerta('¡Cuenta registrada con éxito! Redirigiendo al inicio de sesión...', 'exito');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1800);
    }
  </script>
</body>
</html>
